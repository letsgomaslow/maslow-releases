name: Release infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools zstd
      - run: python3 -m unittest discover -s tests -v
