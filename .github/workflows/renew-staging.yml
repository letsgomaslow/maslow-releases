name: Renew Hub staging signatures

# Execute only protected main; signed-staging contains inert published data.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-staging-publish
  cancel-in-progress: false

jobs:
  renew:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hub-staging-signing
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read published data without executing branch code
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/signed-staging
          base=$(git rev-parse FETCH_HEAD)
          echo "PUBLISHED_BASE=$base" >> "$GITHUB_ENV"
          python3 tools/channel-data.py extract --base "$base" --directory "$RUNNER_TEMP/published"
          fingerprint=$(openssl pkey -pubin -in bootstrap/release.pem -outform DER | sha256sum | cut -d ' ' -f 1)
          [[ $fingerprint == daacaa5aac138710a3950097b29a05abd3f69c9a8efad512321c45f3103d1ee4 ]]

      - name: Renew staging metadata
        env:
          HUB_RELEASE_SIGNING_KEY: ${{ secrets.HUB_RELEASE_SIGNING_KEY }}
          HUB_SIGNING_PASSPHRASE: ${{ secrets.HUB_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          if [[ -z $HUB_RELEASE_SIGNING_KEY || -z $HUB_SIGNING_PASSPHRASE ]]; then
            echo "Set both signing secrets in the hub-staging-signing environment." >&2
            exit 1
          fi
          printf '%s\n' "$HUB_RELEASE_SIGNING_KEY" > "$key"
          python3 tools/renew/renew-channel.py \
            --channel-dir "$RUNNER_TEMP/published" \
            --private-key "$key" \
            --public-key bootstrap/release.pem \
            --output-dir "$RUNNER_TEMP/renewed"

      - name: Publish only the four signed staging files
        run: |
          set -euo pipefail
          commit=$(python3 tools/channel-data.py commit --base "$PUBLISHED_BASE" --directory "$RUNNER_TEMP/renewed")
          # A concurrent promotion rejects this normal push; never force signed metadata.
          git push origin "$commit:refs/heads/signed-staging"

      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Verify anonymous delivery of both signed pairs
        run: |
          python3 tools/verify-delivery.py \
            --expected-dir "$RUNNER_TEMP/renewed" \
            --public-key bootstrap/release.pem \
            --base-url https://letsgomaslow.github.io/maslow-releases/hub/staging
